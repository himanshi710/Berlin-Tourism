    <!-- Single Page Apps for GitHub Pages redirect handler -->
    <script>
      (function (l) {
        if (l.search[1] === 'p') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .reduce(function (memo, item) {
              var parts = item.split('=');
              memo[parts[0]] = parts
                .slice(1)
                .join('=')
                .replace(/~and~/g, '&');
              return memo;
            }, {});
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              (decoded.p || '') +
              (decoded.q ? '?' + decoded.q : '') +
              l.hash
          );
        }
      })(window.location);
    </script>
