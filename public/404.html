<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Berlin Tourism</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Stores the current path in sessionStorage then redirects to index.html
      var pathSegmentsToKeep = 1; // number of path segments in the repo name (Berlin-Tourism = 1)
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
